spring:
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Use 'validate' or 'none' for production to protect your existing schema
      ddl-auto: update
    show-sql: false # Turn off verbose logs in production
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hikari:
      maximum-pool-size: 10 # Optimised for production traffic
      connection-timeout: 30000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
              - openid

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  refresh-token-cookie-name: RefreshToken
  cookie-http-only: true
  cookie-secure: true # Set to true since production must use HTTPS
  cookie-same-site: Lax
  refresh-ttl-seconds: 604800

app:
  frontend:
    url: ${FRONTEND_URL}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}


cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}

resend:
  api-key: ${RESEND_API_KEY}